name: 部署到 GitHub Pages

# 推送到 main 就自动构建并部署；也可以在网页上手动触发。
"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write      # 部署到 Pages
  id-token: write   # deploy-pages 需要的 OIDC

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ⚠️ 站点部署在 https://<user>.github.io/akGachaData/ 这样的**子路径**下，
      #    必须给 Vite 和 Vue Router 设置 base，否则资源路径和路由都会错位。
      #    vite.config.js 读 VITE_BASE；router 用 import.meta.env.BASE_URL。
      #    （若将来改用自定义域名或根路径部署，把这里改成 `/` 即可。）
      - name: 构建
        env:
          VITE_BASE: /akGachaData/
        run: pnpm build

      # ⚠️ SPA 深链兜底：GitHub Pages 没有 history fallback，
      #    直接访问 /up-history 或刷新子页面会 404。把 index.html 复制成 404.html，
      #    Pages 就会用它兜底（Vue Router 再根据 URL 还原到对应页面）。
      - name: SPA 404 兜底
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
